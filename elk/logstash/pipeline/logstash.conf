# Logstash Centralized Ingestion & Grok Parsing Pipeline
# Assessment: Lab 3 - Task 1 (ELK Stack Log Parsing & Visualization)

input {
  # Beats input for Filebeat shippers
  beats {
    port => 5044
  }

  # Direct HTTP ingestion endpoint for application telemetry
  http {
    port => 8080
    codec => "json"
  }

  # File ingestion for local container log forwarding
  file {
    path => "/var/log/app/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }
}

filter {
  # Parse JSON structured logs if present
  if [message] =~ "^\{" {
    json {
      source => "message"
      target => "parsed_json"
    }
    mutate {
      add_field => {
        "client_ip"     => "%{[parsed_json][client_ip]}"
        "http_method"   => "%{[parsed_json][method]}"
        "request_path"  => "%{[parsed_json][endpoint]}"
        "status_code"   => "%{[parsed_json][status_code]}"
        "latency_ms"    => "%{[parsed_json][latency_ms]}"
        "log_level"     => "%{[parsed_json][level]}"
        "correlation_id"=> "%{[parsed_json][correlation_id]}"
      }
    }
  } else {
    # Grok pattern for standard HTTP access logs
    grok {
      match => { 
        "message" => "%{IPORHOST:client_ip} - %{DATA:user_id} \[%{HTTPDATE:timestamp}\] \"%{WORD:http_method} %{URIPATHPARAM:request_path} HTTP/%{NUMBER:http_version}\" %{NUMBER:status_code:int} %{NUMBER:bytes_sent:int} %{NUMBER:latency_ms:float}"
      }
      add_tag => ["grok_parsed_access_log"]
    }
  }

  # Data typing and enrichment
  mutate {
    convert => {
      "status_code" => "integer"
      "latency_ms"  => "float"
    }
    add_field => {
      "course"      => "Lab 3: Monitoring, Logging & DevSecOps"
      "operator"    => "Sai Nayan Mamilla"
      "environment" => "production"
    }
  }

  # Classify HTTP Status Categories
  if [status_code] >= 500 {
    mutate { add_field => { "http_category" => "5xx_server_error" } }
  } else if [status_code] >= 400 {
    mutate { add_field => { "http_category" => "4xx_client_error" } }
  } else if [status_code] >= 300 {
    mutate { add_field => { "http_category" => "3xx_redirect" } }
  } else {
    mutate { add_field => { "http_category" => "2xx_success" } }
  }

  # Normalize Timestamp
  date {
    match => [ "timestamp", "ISO8601", "dd/MMM/yyyy:HH:mm:ss Z" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch-node:9200"]
    index => "devops-telemetry-logs-%{+YYYY.MM.dd}"
  }

  # Console debugging for operational verification
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}
