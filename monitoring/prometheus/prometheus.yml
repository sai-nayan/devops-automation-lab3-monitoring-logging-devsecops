# Prometheus Monitoring & Alerting Configuration
# Course Assessment: Lab 3 - Task 3 (Prometheus & Grafana)

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: 'devops-cluster-monitor'
    student: 'sainayanmamilla'
    lab: 'lab3-monitoring'

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'telemetry-microservice'
    metrics_path: '/metrics'
    scrape_interval: 3s
    static_configs:
      - targets: ['target-telemetry-app:5000', 'localhost:5000']
        labels:
          service: 'telemetry-app'
          env: 'production'
          tier: 'frontend-api'

  - job_name: 'prometheus-self'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'elasticsearch-cluster'
    scrape_interval: 10s
    static_configs:
      - targets: ['elasticsearch-node:9200']
